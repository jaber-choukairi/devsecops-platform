services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devsecops_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - devsecops_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/tickets"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: devsecops_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devsecops_network

networks:
  devsecops_network:
    driver: bridge