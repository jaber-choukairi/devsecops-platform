apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: devsecops
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: jaber7/devsecops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: db-url

            - name: SUPABASE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: db-username

            - name: SUPABASE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: db-password

            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_PROFILES_ACTIVE

          readinessProbe:
            httpGet:
              path: /api/tickets
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/tickets
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"