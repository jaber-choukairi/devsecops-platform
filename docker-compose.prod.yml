services:
  backend:
    image: jaber7/devsecops-backend:latest
    container_name: devsecops_backend_prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - devsecops_network

  frontend:
    image: jaber7/devsecops-frontend:latest
    container_name: devsecops_frontend_prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devsecops_network

networks:
  devsecops_network:
    driver: bridge