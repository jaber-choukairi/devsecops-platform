name: CI/CD DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:

  backend-tests:
    name: Backend - Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Run backend tests
        run: mvn test


  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  sast-sonarcloud:
    name: SAST - SonarCloud Analysis
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend for SonarCloud
        run: mvn clean package -DskipTests
        working-directory: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.java.binaries=backend/target/classes


  sca-trivy:
    name: SCA - Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-report.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Build backend image for scan
        run: docker build -t devsecops-backend-scan ./backend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: devsecops-backend-scan
          format: json
          output: trivy-backend-report.json
          severity: CRITICAL
          exit-code: 1

      - name: Build frontend image for scan
        run: docker build -t devsecops-frontend-scan ./frontend

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: devsecops-frontend-scan
          format: json
          output: trivy-frontend-report.json
          severity: CRITICAL
          exit-code: 1

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-reports
          path: |
            trivy-fs-report.json
            trivy-backend-report.json
            trivy-frontend-report.json
          retention-days: 30


  docker-build-push:
    name: Docker - Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - sast-sonarcloud
      - sca-trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-backend:${{ env.IMAGE_TAG }} \
            ./backend

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-frontend:${{ env.IMAGE_TAG }} \
            ./frontend

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-frontend:${{ env.IMAGE_TAG }}


  dast-owasp-zap:
    name: DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs:
      - docker-build-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start backend for ZAP scan
        run: |
          docker run -d \
            --name backend-zap \
            -p 8080:8080 \
            -e SUPABASE_DB_URL="${{ secrets.SUPABASE_DB_URL }}" \
            -e SUPABASE_DB_USERNAME="${{ secrets.SUPABASE_DB_USERNAME }}" \
            -e SUPABASE_DB_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" \
            -e SPRING_PROFILES_ACTIVE=prod \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-backend:latest

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/tickets > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 10
          done
          echo "Backend did not start in time"
          docker logs backend-zap
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          fail_action: warn
        continue-on-error: true

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

      - name: Stop backend container
        if: always()
        run: docker stop backend-zap || true